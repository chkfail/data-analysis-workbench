appId: local.data-analysis-workbench
productName: 数据研判工具箱
copyright: Copyright © 2025

directories:
  output: dist/electron

files:
  - electron/**
  - out/**
  - package.json
  - "!node_modules/**"

# Electron 22.3.27 是最后一个支持 Windows 7/8/8.1 的版本（Chromium 108），
# 版本号取自 devDependencies 中固定的 electron。
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 数据研判工具箱

portable:
  artifactName: 数据研判工具箱-portable-${version}.${ext}
